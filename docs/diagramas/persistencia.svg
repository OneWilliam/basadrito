<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="storage-title storage-desc" id="persistencia-root">
<title id="storage-title">Estrategia prevista de persistencia</title>
<desc id="storage-desc">Almacenamiento local separado por datos académicos, secretos de sesión y preferencias. El BFF puede añadir PostgreSQL para datos propios duraderos.</desc>
<defs>
      <style>#persistencia-root { color: #2d3142; font-family: 'Geist',system-ui,sans-serif; }
      #persistencia-root .intro, #persistencia-root .caption { font-size:14px;line-height:1.6;color:#4f5d75;max-width:900px }
      #persistencia-root .diagram-container { width:100%;overflow-x:auto }
      #persistencia-root .caption { border-top:1px solid #bfc0c0;padding-top:16px }
      #persistencia-root .diagram-container { overflow:visible }</style><marker id="persistencia-storage-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<rect x="32" y="70" width="748" height="566" rx="6" fill="none" stroke="#4f5d75" stroke-opacity="0.45" stroke-dasharray="5,4"/>
<rect x="828" y="70" width="420" height="566" rx="6" fill="none" stroke="#4f5d75" stroke-opacity="0.45" stroke-dasharray="5,4"/>
<text x="52" y="104" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">DISPOSITIVO · ANDROID PRIMERO</text>
<text x="848" y="104" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">SERVIDOR · AL INCORPORAR BFF</text>
<path d="M 324 198 L 436 198" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#persistencia-storage-arrow)"/>
<path d="M 324 358 L 436 358" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#persistencia-storage-arrow)"/>
<path d="M 324 518 L 436 518" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#persistencia-storage-arrow)"/>
<path d="M 1038 226 L 1038 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#persistencia-storage-arrow)"/>
<rect x="60" y="158" width="264" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="80" y="190" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Datos académicos</text><text x="80" y="214" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">CUENTA · PROVEEDOR · PERÍODO</text>
<rect x="436" y="158" width="312" height="100" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.2"/><text x="456" y="190" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">SQLite / Room</text><text x="456" y="214" fill="#bf4520" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">CACHÉ · TRANSACCIÓN · MIGRACIÓN</text>
<rect x="60" y="318" width="264" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="80" y="350" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Material de sesión</text><text x="80" y="374" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">TOKEN / COOKIE RECUPERABLE</text>
<rect x="436" y="318" width="312" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="456" y="350" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Almacén protegido</text><text x="456" y="374" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">CIFRADO + CLAVE EN KEYSTORE</text>
<rect x="60" y="478" width="264" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="80" y="510" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Preferencias</text><text x="80" y="534" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">TEMA · FILTROS PEQUEÑOS</text>
<rect x="436" y="478" width="312" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="456" y="510" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Almacén de preferencias</text><text x="456" y="534" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">ADAPTADOR DE PLATAFORMA</text>
<rect x="860" y="146" width="356" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="880" y="178" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Datos propios de Basadrito</text><text x="880" y="202" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">PREFERENCIAS / RECORDATORIOS</text>
<rect x="860" y="340" width="356" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="880" y="372" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">PostgreSQL previsto</text><text x="880" y="396" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">CUANDO SE NECESITE PERSISTIR</text>
<text x="456" y="238" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600">Fecha de actualización por instantánea.</text>
<text x="456" y="398" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600">Separado de tablas y caché académica.</text>
<text x="456" y="558" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600">Sin credenciales del proveedor.</text>
<text x="860" y="496" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600">La sesión web tendrá su política</text>
<text x="860" y="520" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600">propia de expiración y protección.</text>
<text x="860" y="570" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600">Web: adaptador local específico</text>
<text x="860" y="594" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="12" font-weight="600">si necesita caché persistente.</text>
<text x="52" y="680" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">Plan: consulta remota → caché local → recuperación protegida → sincronización según requisitos.</text>
</svg>
