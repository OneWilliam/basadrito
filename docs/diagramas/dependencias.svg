<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="deps-title deps-desc" id="dependencias-root">
<title id="deps-title">Dependencias de módulos</title>
<desc id="deps-desc">La composición depende de shared y data; ambos consumen contratos de domain. Server y probe ensamblan data. Las flechas expresan dependencias de código.</desc>
