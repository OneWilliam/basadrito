      #dependencias-root .diagram-container { width:100%;overflow-x:auto }
      #dependencias-root .caption { border-top:1px solid #bfc0c0;padding-top:16px }
      #dependencias-root .diagram-container { overflow:visible }</style><marker id="dependencias-deps-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
