<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="query-title query-desc" id="recorrido-consulta-root">
<title id="query-title">Recorrido previsto de una consulta</title>
<desc id="query-desc">Una acción de pantalla invoca al ViewModel y repositorio. El adaptador consulta al proveedor; el repositorio actualiza la DB y devuelve datos. El ViewModel publica estado.</desc>
<defs>
      <style>#recorrido-consulta-root { color: #2d3142; font-family: 'Geist',system-ui,sans-serif; }
      #recorrido-consulta-root .intro, #recorrido-consulta-root .caption { font-size:14px;line-height:1.6;color:#4f5d75;max-width:900px }
      #recorrido-consulta-root .diagram-container { width:100%;overflow-x:auto }
      #recorrido-consulta-root .caption { border-top:1px solid #bfc0c0;padding-top:16px }
      #recorrido-consulta-root .diagram-container { overflow:visible }</style><marker id="recorrido-consulta-query-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
