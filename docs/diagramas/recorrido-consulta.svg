<path d="M 1000 164 L 900 164" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recorrido-consulta-query-arrow)"/>
<path d="M 770 180 L 770 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recorrido-consulta-query-arrow)"/>
<path d="M 830 320 L 830 180" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recorrido-consulta-query-arrow)"/>
