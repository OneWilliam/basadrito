<rect x="40" y="100" width="220" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="60" y="132" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Pantalla Compose</text><text x="60" y="156" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">EVENTO Y REPRESENTACIÓN</text>
<rect x="340" y="100" width="220" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="360" y="132" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">ViewModel</text><text x="360" y="156" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">COORDINA LA INTERACCIÓN</text>
<rect x="680" y="100" width="220" height="80" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.2"/><text x="700" y="132" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Repositorio</text><text x="700" y="156" fill="#bf4520" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">CONTRATO DE DOMINIO</text>
<rect x="1000" y="100" width="220" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="1020" y="132" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Adaptador remoto</text><text x="1020" y="156" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">HTTP · DTO / PARSER</text>
<rect x="1000" y="320" width="220" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="1020" y="352" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Proveedor</text><text x="1020" y="376" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">MOODLE O INTRANET</text>
<rect x="680" y="320" width="220" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="700" y="352" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">Caché local prevista</text><text x="700" y="376" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">SQLITE / ROOM</text>
<rect x="340" y="320" width="220" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><text x="360" y="352" fill="#2d3142" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600">UiState</text><text x="360" y="376" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">DATOS · CARGA · ERROR</text>
<text x="572" y="120" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">invoca</text>
<text x="910" y="120" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">consulta</text>
<text x="1118" y="248" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">HTTP</text>
<text x="1160" y="280" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">retorno</text>
<text x="842" y="240" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">datos</text>
<text x="690" y="280" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">transacción</text>
<text x="468" y="252" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">publica</text>
<text x="48" y="200" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">representa nuevo estado</text>
<line x1="40" y1="456" x2="1240" y2="456" stroke="#2d3142" stroke-opacity="0.15"/>
<text x="40" y="508" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400">01 · LECTURA</text>
<text x="40" y="540" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600">El repositorio puede emitir caché</text>
<text x="40" y="564" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600">antes de refrescar.</text>
<text x="440" y="508" fill="#bf4520" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400">02 · ACTUALIZACIÓN</text>
<text x="440" y="540" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600">La respuesta se valida y</text>
<text x="440" y="564" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600">persiste por cuenta/período.</text>
<text x="850" y="508" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400">03 · FALLO DE RED</text>
<text x="850" y="540" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600">Se conserva la instantánea y</text>
<text x="850" y="564" fill="#4f5d75" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600">se informa su antigüedad.</text>
<text x="40" y="636" fill="#4f5d75" font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="400">Continua = llamada o publicación. Discontinua = retorno de datos. La DB es una capacidad planificada.</text>
</svg>
