      #autenticacion-secuencia-root .diagram-container { width:100%;overflow-x:auto }
      #autenticacion-secuencia-root .caption { border-top:1px solid #bfc0c0;padding-top:16px;margin-top:16px }
      #autenticacion-secuencia-root .diagram-container { overflow-x:visible }</style>
