<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-sequence-title auth-sequence-desc" id="autenticacion-secuencia-root">
<title id="auth-sequence-title">Autenticación conjunta de Moodle e Intranet</title>
<desc id="auth-sequence-desc">Secuencia de éxito: el repositorio abre una conexión provisional, autentica Moodle, ejecuta el intercambio entre Campus e Intranet, verifica el perfil y activa la sesión solo si sigue vigente. Algunas operaciones HTTP se agrupan; los fallos se explican en el documento.</desc>
